services:
  ot_collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REPO_URL: https://github.com/Abdoun1m/ot_collector
        REPO_BRANCH: main
    container_name: ot_collector
    network_mode: none
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    ports:
      - "5514:514/udp"
      - "1514:1514/tcp"
      - "8088:8088/tcp"
    environment:
      OT_COLLECTOR_ZONE: OT
      UDP_SYSLOG_ADDR: 0.0.0.0:514
      TCP_SYSLOG_ADDR: 0.0.0.0:1514
      API_ADDR: 0.0.0.0:8088
      EVENTS_FILE: /data/events.jsonl
      DMZ_COLLECTOR_URL: ""
      LOG_LEVEL: info
    volumes:
      - ot-collector-data:/data

volumes:
  ot-collector-data:

